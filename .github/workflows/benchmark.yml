name: Benchmark

on:
  schedule:
    - cron: "0 3 * * 1"   # Every Monday at 03:00 UTC
  workflow_dispatch:        # Also triggerable manually from GitHub UI

jobs:
  benchmark:
    name: Event-density and size sweep (synthetic clip)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install neurocodec (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Generate synthetic test clip
        run: |
          python - <<'EOF'
          import cv2, numpy as np
          w = cv2.VideoWriter("bench.mp4", cv2.VideoWriter_fourcc(*"mp4v"), 30.0, (320, 240))
          for i in range(150):
              f = np.zeros((240, 320, 3), dtype=np.uint8)
              x = int((i / 150) * 290)
              f[80:160, x:x+30] = 255
              w.write(f)
          w.release()
          EOF

      - name: Threshold sweep (events) and encoded size
        run: |
          neurocodec benchmark bench.mp4 --output benchmark_results.json
          for c in 0.1 0.2 0.5; do
            neurocodec encode bench.mp4 bench_$c.nec --threshold $c
          done
          ls -l bench_*.nec
          cat benchmark_results.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_number }}
          path: benchmark_results.json
          retention-days: 90
